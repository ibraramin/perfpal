# cargo-about configuration — plan `beta-release` B3.
#
# Generates THIRD-PARTY-NOTICES.md (shipped with the release bundle) from
# Cargo.lock, satisfying the attribution obligations of the permissive
# dependencies (notably Apache-2.0). The `accepted` set mirrors deny.toml's
# allowlist so the two gates cannot drift: policy is NO copyleft (GPL-family)
# anywhere in the dependency closure. `LicenseRef-Proprietary` (perfpal itself)
# is deliberately not listed — it is handled by the `private` ignore below.

accepted = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]

# perfpal itself carries `license = "LicenseRef-Proprietary"` and is not on
# the allowlist above. It is a `publish = false` workspace member, so ignore
# private members rather than treating our own license as a violation.
private = { ignore = true }
