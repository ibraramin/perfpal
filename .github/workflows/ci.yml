name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: never

# Supply-chain posture (P6): every action pinned to a full commit SHA.
# Bump by resolving the tag to a new commit — never re-point at a moving ref.
# dtolnay/rust-toolchain has no version tags; pin its master-branch HEAD
# (the repo documents full-length master SHAs as the supported pin form).

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # master HEAD at pin time; the action requires an explicit `toolchain` input
      # (it does NOT auto-read rust-toolchain.toml — first-run validated 2026-09-01).
      # "1.92.0" mirrors rust-toolchain.toml and release.yml exactly.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.92.0"
          components: rustfmt, clippy

      # v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Byte-determinism guard — serde_json preserve_order must stay OFF
        run: |
          if grep -n 'preserve_order' Cargo.lock; then
            echo "::error::serde_json preserve_order feature leaked into the dependency graph (modules.md §6 row 3)"
            exit 1
          fi

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: test
        run: cargo test --locked

  # Semantic-resolver feature gate (plan `semantic-resolver`): the
  # `semantic-clang` cargo feature (default OFF everywhere else) must stay
  # green WITH libclang present (ubuntu libclang-dev) AND degrade gracefully
  # without it. Real-parse tests run only under PERFPAL_SEMANTIC_TESTS=1;
  # they skip with a note when libclang is unavailable — never fail.
  semantic-features:
    runs-on: ubuntu-latest
    steps:
      # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # master HEAD at pin time; same explicit-toolchain requirement as the
      # `check` job above (the action does NOT auto-read rust-toolchain.toml).
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.92.0"
          components: rustfmt, clippy

      # v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Install libclang (semantic-resolver runtime dependency)
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy (feature build)
        run: cargo clippy --locked --all-targets --features semantic-clang -- -D warnings

      - name: test (feature build, real libclang parses)
        run: PERFPAL_SEMANTIC_TESTS=1 cargo test --locked --features semantic-clang

  license-audit:
    # Standing obligation (modules.md §6 criterion 4): no copyleft (GPL-family)
    # anywhere in the dependency closure. Runs on every push/PR.
    runs-on: ubuntu-latest
    steps:
      # v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # master HEAD at pin time; same explicit-toolchain requirement as the
      # `check` job above.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.92.0"

      # v2.9.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      # v2.1.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25
        with:
          command: check licenses
