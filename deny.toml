# cargo-deny configuration — license policy per modules.md §6 criterion 4.
# Policy: NO copyleft (GPL-family) dependencies anywhere in the core tool.
# Allowlist below is deliberately minimal; adding a license requires a
# founder-visible audit of the crate that needs it.

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "LicenseRef-PolyForm-Strict-1.0.0", # perfpal itself — source-available proprietary (see Cargo.toml)
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
