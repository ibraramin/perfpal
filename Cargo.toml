[package]
name = "perfpal"
version = "0.2.0-beta.1"
edition = "2024"
rust-version = "1.92.0" # validated floor; pinned via rust-toolchain.toml (modules.md §6)
description = "Static-analysis CLI that extracts performance-relevant heuristics from C and Rust codebases and emits LLM-consumable metrics."
license = "LicenseRef-Proprietary"
publish = false
# License: source-available proprietary (free to use; modification/redistribution
# require explicit founder permission). Dependency policy: no copyleft (GPL-family)
# anywhere in the dependency closure — enforced by CI (`cargo deny check licenses`).

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.1", features = ["derive"] }
petgraph = "=0.8.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151" # default features only; `preserve_order` MUST stay OFF (byte-determinism guard, modules.md §6 row 3)
thiserror = "=2.0.20"
tree-sitter = "=0.26.13" # ADR-0001 G5: exact pins for parser runtime + grammar
tree-sitter-c = "=0.24.2"
tree-sitter-rust = "=0.24.2" # ADR-0001 G5: exact pin for the Rust grammar (plan rust-backend)
# Optional semantic-resolver engine (ADR-0001 deferred tier). Gated behind the
# `semantic-clang` cargo feature (default OFF — musl release targets cannot
# dlopen, so the feature stays OFF there by design). `runtime` = lazy dlopen
# via libloading: the binary builds and runs WITHOUT libclang present
# (graceful absence is a first-class path); licenses (Apache-2.0/MIT) are in
# the deny.toml allowlist.
clang-sys = { version = "=1.9.1", optional = true, default-features = false, features = [
    "runtime",
] }

[features]
# Semantic resolver tier (libclang enrichment, plan `semantic-resolver`).
# Default OFF everywhere; darwin x2 + windows-msvc + new gnu release targets
# pass it, musl x2 do not (static musl cannot dlopen).
semantic-clang = ["dep:clang-sys"]

[profile.release]
# Hardened release profile (plan `beta-release` B1).
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols" # strips symbols for size; NOT obfuscation (rustc: -Cstrip is not an obfuscation mechanism)
# `panic = "abort"` is deliberately NOT set: the CLI's exit-code-3 contract maps a
# caught panic to exit 3 via `std::panic::catch_unwind` (docs/architecture/modules.md
# §8.2), which requires unwinding. `abort` would silently break that contract in
# release builds. Keep unwinding explicit:
panic = "unwind"
